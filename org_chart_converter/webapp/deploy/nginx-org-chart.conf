# Reverse proxy for the Org Chart Wireframe app (gunicorn on 127.0.0.1:8000).
# Copy to /etc/nginx/conf.d/org-chart.conf (or sites-available on Debian),
# replace the server_name, and reload nginx: `nginx -t && systemctl reload nginx`.
#
# Uploads can be large-ish spreadsheets - client_max_body_size must be at
# least as big as MAX_CONTENT_LENGTH in webapp/app.py (25 MB by default).

server {
    listen 80;
    server_name orgchart.example.com;

    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# For HTTPS, either terminate TLS here (a `listen 443 ssl;` server block with
# your certificate) or put this behind whatever TLS-terminating load
# balancer/proxy your infrastructure already uses. Given this handles real
# reporting-line data, don't serve it over plain HTTP on the open internet -
# put it on an internal network, behind a VPN, or behind your normal SSO.
